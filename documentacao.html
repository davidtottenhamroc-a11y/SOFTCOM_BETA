<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Documentação | Softcom</title><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"></head><body><div class="container"><header class="topbar"><div><div class="brand"><span class="brand-mark">S</span> Softcom</div><div class="subtitle">Documentação • Biblioteca independente</div></div><div class="topbar-actions"><a class="btn btn-dark" href="/menu.html"><i class="fas fa-arrow-left"></i> Menu</a><button class="btn btn-dark" onclick="loadAll()"><i class="fas fa-rotate"></i> Atualizar</button><button class="btn btn-dark admin-only" onclick="createFolder()"><i class="fas fa-folder-plus"></i> Nova Pasta</button><a class="btn btn-primary admin-only" href="/cadastro_documento.html"><i class="fas fa-plus"></i> Novo Item</a></div></header><main class="page"><section class="panel card"><div class="toolbar"><div><span class="eyebrow">BIBLIOTECA</span><h1 style="margin:5px 0 7px">Documentação</h1><p class="muted" style="margin:0;max-width:760px">Pastas, textos, PDF, HTML, vídeo, imagem, áudio, links e arquivos diversos. Este módulo não alimenta nenhum chatbot.</p></div><div class="search-box"><i class="fas fa-magnifying-glass"></i><input id="searchInput" class="input" placeholder="Buscar documento..."></div></div><div id="message"></div><div id="documentList"><div class="loading"><i class="fas fa-spinner fa-spin"></i>Carregando...</div></div></section></main></div>
<div id="contentModal" class="modal-overlay"><div class="modal-card"><div class="modal-head"><div id="modalTitle" class="modal-title"><i class="fas fa-eye"></i> Visualizar</div><button class="btn btn-dark" onclick="closeModal()"><i class="fas fa-xmark"></i> Fechar</button></div><div id="modalViewer" class="modal-body"></div><div class="modal-foot"><span id="modalInfo" class="modal-info">Visualização rápida</span><div class="actions"><button class="btn btn-primary" id="modalOpenExternal"><i class="fas fa-up-right-from-square"></i> Abrir Link</button><button class="btn btn-primary" id="modalDownload"><i class="fas fa-download"></i> Baixar</button></div></div></div></div>
<script src="/app.js"></script><script>
if(!Softcom.requireAuth())throw new Error('Não autenticado.');const isAdmin=Softcom.isAdmin();document.querySelectorAll('.admin-only').forEach(el=>{if(!isAdmin)el.classList.add('hidden')});const list=document.getElementById('documentList'),message=document.getElementById('message'),searchInput=document.getElementById('searchInput'),modal=document.getElementById('contentModal'),modalViewer=document.getElementById('modalViewer');let folders=[],documents=[],blobUrl=null;function showMessage(t,type='success'){message.innerHTML=`<div class="notice ${type}">${Softcom.escape(t)}</div>`}function icon(t){return({TEXTO:'fa-file-lines',PDF:'fa-file-pdf',HTML:'fa-file-code',VIDEO:'fa-video',IMAGEM:'fa-image',AUDIO:'fa-volume-high',LINK:'fa-link',ARQUIVO:'fa-file'})[t]||'fa-file'}function renderDoc(d){return `<article class="doc-item"><div class="doc-info"><div class="doc-icon"><i class="fas ${icon(d.tipoConteudo)}"></i></div><div style="min-width:0"><div class="doc-title">${Softcom.escape(d.titulo)}</div><div class="doc-file">${Softcom.escape(d.nomeArquivo||d.externalUrl||d.tipoConteudo)}</div></div></div><div class="doc-actions"><button class="btn btn-dark" onclick="viewDocument('${d._id}')"><i class="fas fa-eye"></i> Ver</button>${d.hasBinary?`<button class="btn btn-dark" onclick="downloadDocument('${d._id}')"><i class="fas fa-download"></i> Baixar</button>`:''}${d.externalUrl?`<button class="btn btn-dark" onclick="openExternal('${Softcom.escape(d.externalUrl)}')"><i class="fas fa-up-right-from-square"></i> Abrir</button>`:''}${isAdmin?`<a class="btn btn-dark" href="/cadastro_documento.html?id=${d._id}"><i class="fas fa-pen"></i> Editar</a><button class="btn btn-danger" onclick="deleteDocument('${d._id}')"><i class="fas fa-trash"></i> Excluir</button>`:''}</div></article>`}function render(){const q=searchInput.value.trim().toLowerCase(),filtered=documents.filter(d=>`${d.titulo||''} ${d.descricao||''} ${d.nomeArquivo||''} ${d.pastaNome||''} ${d.tipoConteudo||''}`.toLowerCase().includes(q)),by={};filtered.forEach(d=>{const k=d.pastaId||'sem-pasta';(by[k]||=[]).push(d)});const blocks=folders.map((f,i)=>{const docs=by[f._id]||[],id=`folder-${i}`,tools=isAdmin?`<div class="folder-tools" onclick="event.stopPropagation()"><button class="icon-btn" onclick="renameFolder('${f._id}','${Softcom.escape(f.nome)}')" title="Renomear"><i class="fas fa-pen"></i></button><button class="icon-btn" onclick="deleteFolder('${f._id}')" title="Excluir pasta vazia"><i class="fas fa-trash"></i></button></div>`:'';return `<section class="folder" id="${id}"><button class="folder-header" onclick="toggleFolder('${id}')"><span class="folder-title"><i class="fas fa-chevron-down folder-toggle"></i><i class="fas fa-folder folder-icon"></i>${Softcom.escape(f.nome)}</span><span style="display:flex;align-items:center;gap:9px"><span class="folder-count">${docs.length} ${docs.length===1?'item':'itens'}</span>${tools}</span></button><div class="folder-content" id="content-${id}">${docs.length?docs.map(renderDoc).join(''):'<div class="muted" style="padding:12px">Pasta vazia.</div>'}</div></section>`});const orphan=by['sem-pasta']||[];if(orphan.length)blocks.push(`<section class="folder" id="folder-sem-pasta"><button class="folder-header" onclick="toggleFolder('folder-sem-pasta')"><span class="folder-title"><i class="fas fa-chevron-down folder-toggle"></i><i class="fas fa-folder folder-icon"></i>Sem pasta</span><span class="folder-count">${orphan.length}</span></button><div class="folder-content" id="content-folder-sem-pasta">${orphan.map(renderDoc).join('')}</div></section>`);list.innerHTML=blocks.length?blocks.join(''):'<div class="empty-state"><i class="fas fa-folder-open"></i><strong>Nenhuma documentação encontrada.</strong></div>'}window.toggleFolder=id=>{const f=document.getElementById(id),c=document.getElementById(`content-${id}`);if(f&&c){f.classList.toggle('closed');c.classList.toggle('hidden')}};async function loadAll(){list.innerHTML='<div class="loading"><i class="fas fa-spinner fa-spin"></i>Carregando...</div>';try{const[fr,dr]=await Promise.all([fetch('/api/documentos/pastas',{headers:Softcom.headers()}),fetch('/api/documentos',{headers:Softcom.headers()})]);if(Softcom.handleUnauthorized(fr)||Softcom.handleUnauthorized(dr))return;const fd=await fr.json(),dd=await dr.json();if(!fr.ok)throw new Error(fd.message||'Erro ao carregar pastas.');if(!dr.ok)throw new Error(dd.message||'Erro ao carregar documentos.');folders=fd;documents=dd;render()}catch(e){list.innerHTML=`<div class="notice error">${Softcom.escape(e.message)}</div>`}}async function createFolder(){if(!isAdmin)return;const nome=prompt('Nome da nova pasta:');if(!nome?.trim())return;const r=await fetch('/api/documentos/pastas',{method:'POST',headers:Softcom.headers(true),body:JSON.stringify({nome:nome.trim()})}),d=await r.json();showMessage(d.message||(r.ok?'Pasta criada.':'Erro.'),r.ok?'success':'error');if(r.ok)loadAll()}async function renameFolder(id,current){if(!isAdmin)return;const nome=prompt('Novo nome da pasta:',current);if(!nome?.trim())return;const r=await fetch(`/api/documentos/pastas/${id}`,{method:'PUT',headers:Softcom.headers(true),body:JSON.stringify({nome:nome.trim()})}),d=await r.json();showMessage(d.message||(r.ok?'Pasta renomeada.':'Erro.'),r.ok?'success':'error');if(r.ok)loadAll()}async function deleteFolder(id){if(!isAdmin||!confirm('Excluir esta pasta? Ela precisa estar vazia.'))return;const r=await fetch(`/api/documentos/pastas/${id}`,{method:'DELETE',headers:Softcom.headers()}),d=await r.json();showMessage(d.message||(r.ok?'Pasta excluída.':'Erro.'),r.ok?'success':'error');if(r.ok)loadAll()}function closeModal(){if(blobUrl){URL.revokeObjectURL(blobUrl);blobUrl=null}modal.classList.remove('active');modalViewer.innerHTML=''}function openExternal(url){if(!Softcom.validHttpUrl(url))return alert('URL inválida.');window.open(url,'_blank','noopener,noreferrer')}function youtubeEmbed(url){try{const u=new URL(url);if(u.hostname.includes('youtube.com')){const id=u.searchParams.get('v');if(id)return `https://www.youtube.com/embed/${encodeURIComponent(id)}`;const p=u.pathname.split('/').filter(Boolean);if(p[0]==='embed'&&p[1])return `https://www.youtube.com/embed/${encodeURIComponent(p[1])}`}if(u.hostname==='youtu.be'){const id=u.pathname.split('/').filter(Boolean)[0];if(id)return `https://www.youtube.com/embed/${encodeURIComponent(id)}`}if(u.hostname.includes('vimeo.com')){const id=u.pathname.split('/').filter(Boolean).pop();if(/^\d+$/.test(id||''))return `https://player.vimeo.com/video/${id}`}}catch{}return null}async function viewDocument(id){modal.classList.add('active');modalTitle.innerHTML='<i class="fas fa-eye"></i> Carregando...';modalViewer.innerHTML='<div class="loading"><i class="fas fa-spinner fa-spin"></i>Carregando conteúdo...</div>';modalDownload.classList.add('hidden');modalOpenExternal.classList.add('hidden');try{const r=await fetch(`/api/documentos/content/${id}`,{headers:Softcom.headers()});if(Softcom.handleUnauthorized(r))return;const item=await r.json();if(!r.ok)throw new Error(item.message||'Erro ao visualizar.');modalTitle.innerHTML=`<i class="fas ${icon(item.tipoConteudo)}"></i> ${Softcom.escape(item.titulo)}`;modalInfo.textContent=`${item.pastaNome||'Sem pasta'} • ${item.tipoConteudo}`;if(item.externalUrl){modalOpenExternal.classList.remove('hidden');modalOpenExternal.onclick=()=>openExternal(item.externalUrl)}if(item.content){modalDownload.classList.remove('hidden');modalDownload.onclick=()=>downloadDocument(item._id)}if(item.tipoConteudo==='TEXTO'){const pre=document.createElement('pre');pre.className='text-preview';pre.textContent=item.texto||'';modalViewer.innerHTML='';modalViewer.appendChild(pre);return}if(item.tipoConteudo==='LINK'){modalViewer.innerHTML=`<div class="empty-state" style="margin:24px"><i class="fas fa-link"></i><strong>Link externo</strong><p>${Softcom.escape(item.externalUrl||'')}</p></div>`;return}if(item.tipoConteudo==='VIDEO'&&item.externalUrl){const embed=youtubeEmbed(item.externalUrl);if(embed){const iframe=document.createElement('iframe');iframe.src=embed;iframe.allow='accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share';iframe.allowFullscreen=true;modalViewer.innerHTML='';modalViewer.appendChild(iframe)}else if(/\.(mp4|webm|ogg)(\?|$)/i.test(item.externalUrl)){const v=document.createElement('video');v.controls=true;v.src=item.externalUrl;modalViewer.innerHTML='';modalViewer.appendChild(v)}else modalViewer.innerHTML='<div class="empty-state" style="margin:24px"><i class="fas fa-video"></i><strong>Vídeo externo</strong><p>Use o botão Abrir Link.</p></div>';return}if(!item.content){modalViewer.innerHTML='<div class="empty-state" style="margin:24px"><i class="fas fa-file"></i><strong>Sem pré-visualização disponível.</strong></div>';return}const binary=atob(item.content),bytes=new Uint8Array(binary.length);for(let i=0;i<binary.length;i++)bytes[i]=binary.charCodeAt(i);blobUrl=URL.createObjectURL(new Blob([bytes],{type:item.mimeType||'application/octet-stream'}));modalViewer.innerHTML='';if(item.tipoConteudo==='PDF'||item.tipoConteudo==='HTML'){const iframe=document.createElement('iframe');iframe.src=blobUrl;if(item.tipoConteudo==='HTML')iframe.setAttribute('sandbox','');modalViewer.appendChild(iframe)}else if(item.tipoConteudo==='VIDEO'||(item.mimeType||'').startsWith('video/')){const v=document.createElement('video');v.controls=true;v.src=blobUrl;modalViewer.appendChild(v)}else if(item.tipoConteudo==='AUDIO'||(item.mimeType||'').startsWith('audio/')){const a=document.createElement('audio');a.controls=true;a.src=blobUrl;modalViewer.appendChild(a)}else if(item.tipoConteudo==='IMAGEM'||(item.mimeType||'').startsWith('image/')){const img=document.createElement('img');img.src=blobUrl;img.alt=item.titulo||'Imagem';modalViewer.appendChild(img)}else modalViewer.innerHTML='<div class="empty-state" style="margin:24px"><i class="fas fa-file"></i><strong>Arquivo disponível para download.</strong><p>Este tipo não possui visualização interna.</p></div>'}catch(e){modalViewer.innerHTML=`<div class="notice error" style="margin:24px">${Softcom.escape(e.message)}</div>`}}async function downloadDocument(id){const r=await fetch(`/api/documentos/download/${id}`,{headers:Softcom.headers()});if(!r.ok){let m='Erro ao baixar.';try{m=(await r.json()).message||m}catch{}return alert(m)}const b=await r.blob(),disp=r.headers.get('content-disposition')||'';let name='arquivo';const m=disp.match(/filename\*=UTF-8''([^;]+)/i)||disp.match(/filename="?([^"]+)"?/i);if(m)name=decodeURIComponent(m[1]);const url=URL.createObjectURL(b),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url)}async function deleteDocument(id){if(!isAdmin||!confirm('Excluir este documento?'))return;const r=await fetch(`/api/documentos/${id}`,{method:'DELETE',headers:Softcom.headers()}),d=await r.json();showMessage(d.message||(r.ok?'Excluído.':'Erro.'),r.ok?'success':'error');if(r.ok)loadAll()}searchInput.addEventListener('input',render);modal.addEventListener('click',e=>{if(e.target===modal)closeModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});loadAll();
</script></body></html>
