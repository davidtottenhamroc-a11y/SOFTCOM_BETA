<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cadastro | Softcom</title><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"></head><body><main class="auth-page"><section class="panel auth-card"><div class="auth-logo">Softcom</div><span class="muted">Cadastro de usuário</span><h1>Novo acesso</h1><form id="registerForm"><div class="field"><label class="label">Usuário</label><input class="input" id="login" required></div><div class="field"><label class="label">Senha</label><input class="input" id="senha" type="password" minlength="6" required></div><div class="field"><label class="label">Chave de cadastro</label><input class="input" id="accessPassword" type="password" required></div><button class="btn btn-primary" id="submitBtn" type="submit"><i class="fas fa-user-plus"></i> Cadastrar</button></form><div id="message"></div><p style="margin-top:18px"><a href="/login.html" class="yellow" style="font-weight:850"><i class="fas fa-arrow-left"></i> Voltar ao login</a></p></section></main><script>
const form=document.getElementById('registerForm'),msg=document.getElementById('message'),btn=document.getElementById('submitBtn');form.addEventListener('submit',async e=>{e.preventDefault();btn.disabled=true;btn.innerHTML='<i class="fas fa-spinner fa-spin"></i> Cadastrando...';msg.innerHTML='';try{const r=await fetch('/api/auth/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({login:login.value.trim(),senha:senha.value,accessPassword:accessPassword.value})});const d=await r.json();if(!r.ok)throw new Error(d.message||d.error||'Erro no cadastro.');msg.innerHTML='<div class="notice success">Usuário cadastrado. Você já pode entrar.</div>';form.reset()}catch(err){msg.innerHTML=`<div class="notice error">${err.message}</div>`}finally{btn.disabled=false;btn.innerHTML='<i class="fas fa-user-plus"></i> Cadastrar'}});
</script></body></html>
