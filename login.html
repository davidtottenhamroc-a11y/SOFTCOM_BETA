<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login | Softcom</title><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"></head><body><main class="auth-page"><section class="panel auth-card"><div class="auth-logo">Softcom</div><span class="muted">Central Operacional</span><h1>Entrar</h1><form id="loginForm"><div class="field"><label class="label">Usuário</label><input class="input" id="login" required autocomplete="username"></div><div class="field"><label class="label">Senha</label><input class="input" id="senha" type="password" required autocomplete="current-password"></div><button class="btn btn-primary" id="submitBtn" type="submit"><i class="fas fa-right-to-bracket"></i> Entrar</button></form><div id="message"></div><p class="muted" style="margin-top:18px">Ainda não possui acesso? <a href="/cadastro.html" class="yellow" style="font-weight:850">Criar usuário</a></p></section></main><script>
const form=document.getElementById('loginForm'),msg=document.getElementById('message'),btn=document.getElementById('submitBtn');form.addEventListener('submit',async e=>{e.preventDefault();btn.disabled=true;btn.innerHTML='<i class="fas fa-spinner fa-spin"></i> Entrando...';msg.innerHTML='';try{const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({login:login.value.trim(),senha:senha.value})});const d=await r.json();if(!r.ok)throw new Error(d.message||'Falha no login.');localStorage.setItem('softcom_token',d.token);localStorage.setItem('softcom_user',JSON.stringify(d.user));location.href='/menu.html'}catch(err){msg.innerHTML=`<div class="notice error">${err.message}</div>`}finally{btn.disabled=false;btn.innerHTML='<i class="fas fa-right-to-bracket"></i> Entrar'}});
</script></body></html>
