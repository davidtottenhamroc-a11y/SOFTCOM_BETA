<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Conhecimento | Softcom</title><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"></head><body><div class="container"><header class="topbar"><div><div class="brand"><span class="brand-mark">S</span> Softcom</div><div class="subtitle">Conhecimento • Base do Chat Softcom</div></div><div class="topbar-actions"><a class="btn btn-dark" href="/menu.html"><i class="fas fa-arrow-left"></i> Menu</a><button class="btn btn-dark" onclick="loadItems()"><i class="fas fa-rotate"></i> Atualizar</button></div></header><main class="page"><section class="page-head"><div><span class="eyebrow">BASE DO CHAT SOFTCOM</span><h1>Conhecimento</h1><p>O conteúdo cadastrado aqui é pesquisado pelo Chat Softcom. Documentação não entra nesta busca.</p></div></section><section class="panel card" id="adminForm"><h2 style="margin-top:0"><i class="fas fa-plus-circle yellow"></i> <span id="formTitle">Novo conhecimento</span></h2><div id="message"></div><form id="knowledgeForm"><div class="grid"><div class="field"><label class="label">Título / palavra-chave</label><input class="input" id="titulo" placeholder="Ex.: Erro 060" required></div><div class="field"><label class="label">URL da imagem (opcional)</label><input class="input" id="imagemUrl" placeholder="https://..."></div></div><div class="field"><label class="label">Conteúdo detalhado</label><textarea class="input" id="texto" rows="9" placeholder="Descreva o procedimento, regra ou solução..." required></textarea></div><input type="hidden" id="editingId"><div class="form-actions"><button class="btn btn-primary" id="saveBtn" type="submit"><i class="fas fa-floppy-disk"></i> Salvar conhecimento</button><button class="btn btn-dark" type="button" onclick="resetForm()"><i class="fas fa-eraser"></i> Limpar</button></div></form></section><section class="panel card" style="margin-top:22px"><div class="toolbar"><div><h2 style="margin:0">Itens cadastrados</h2><div id="total" class="muted" style="margin-top:4px"></div></div><div class="search-box"><i class="fas fa-magnifying-glass"></i><input class="input" id="searchInput" placeholder="Buscar título ou conteúdo..."></div></div><div id="list"><div class="loading"><i class="fas fa-spinner fa-spin"></i>Carregando...</div></div></section></main></div><script src="/app.js"></script><script>
if(!Softcom.requireAuth())throw new Error('Não autenticado.');const isAdmin=Softcom.isAdmin(),list=document.getElementById('list'),message=document.getElementById('message'),form=document.getElementById('knowledgeForm'),saveBtn=document.getElementById('saveBtn'),searchInput=document.getElementById('searchInput');let items=[];if(!isAdmin)document.getElementById('adminForm').classList.add('hidden');function showMessage(t,type='success'){message.innerHTML=`<div class="notice ${type}">${Softcom.escape(t)}</div>`}function render(){const q=searchInput.value.trim().toLowerCase(),filtered=items.filter(i=>`${i.titulo||''} ${i.texto||''}`.toLowerCase().includes(q));total.textContent=`${filtered.length} ${filtered.length===1?'item':'itens'}`;if(!filtered.length){list.innerHTML='<div class="empty-state"><i class="fas fa-database"></i><strong>Nenhum conhecimento encontrado.</strong></div>';return}list.innerHTML=filtered.map(i=>`<article class="memory"><div style="min-width:0;flex:1"><h3>${Softcom.escape(i.titulo)}</h3><p>${Softcom.escape(i.texto)}</p>${i.imagemUrl?`<small class="muted">${Softcom.escape(i.imagemUrl)}</small>`:''}</div>${isAdmin?`<div class="actions"><button class="btn btn-dark" onclick="editItem('${i._id}')"><i class="fas fa-pen"></i> Editar</button><button class="btn btn-danger" onclick="deleteItem('${i._id}')"><i class="fas fa-trash"></i> Excluir</button></div>`:''}</article>`).join('')}async function loadItems(){list.innerHTML='<div class="loading"><i class="fas fa-spinner fa-spin"></i>Carregando...</div>';try{const r=await fetch('/api/memories',{headers:Softcom.headers()});if(Softcom.handleUnauthorized(r))return;const d=await r.json();if(!r.ok)throw new Error(d.message||'Erro ao carregar.');items=Array.isArray(d)?d:[];render()}catch(e){list.innerHTML=`<div class="notice error">${Softcom.escape(e.message)}</div>`}}function editItem(id){const i=items.find(x=>x._id===id);if(!i)return;titulo.value=i.titulo||'';texto.value=i.texto||'';imagemUrl.value=i.imagemUrl||'';editingId.value=id;formTitle.textContent='Editar conhecimento';saveBtn.innerHTML='<i class="fas fa-floppy-disk"></i> Atualizar conhecimento';scrollTo({top:0,behavior:'smooth'})}function resetForm(){form.reset();editingId.value='';formTitle.textContent='Novo conhecimento';saveBtn.innerHTML='<i class="fas fa-floppy-disk"></i> Salvar conhecimento'}form.addEventListener('submit',async e=>{e.preventDefault();if(!isAdmin)return;const body={titulo:titulo.value.trim(),texto:texto.value.trim(),imagemUrl:imagemUrl.value.trim()},id=editingId.value;saveBtn.disabled=true;try{const r=await fetch('/api/memories'+(id?'/'+id:''),{method:id?'PUT':'POST',headers:Softcom.headers(true),body:JSON.stringify(body)});if(Softcom.handleUnauthorized(r))return;const d=await r.json();if(!r.ok)throw new Error(d.message||'Erro ao salvar.');showMessage(d.message||'Salvo.');resetForm();await loadItems()}catch(err){showMessage(err.message,'error')}finally{saveBtn.disabled=false}});async function deleteItem(id){if(!isAdmin||!confirm('Excluir este conhecimento?'))return;const r=await fetch('/api/memories/'+id,{method:'DELETE',headers:Softcom.headers()});const d=await r.json();if(!r.ok)return alert(d.message||'Erro ao excluir.');loadItems()}searchInput.addEventListener('input',render);loadItems();
</script></body></html>
